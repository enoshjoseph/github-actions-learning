
name: My First GitHub Action


on:
  push:
    paths:
      - 'hello.py'
      - 'test_math.py'
      - '.github/workflows/first-workflow.yml'

  pull_request:
    paths:
      - 'hello.py'
      - 'test_math.py'
      - '.github/workflows/first-workflow.yml'

  workflow_dispatch:


env:
  APP_NAME: GitHubActionsLearning

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display application name
        run: 'echo "Application: $APP_NAME"'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install pytest

      
      - name: Run automated tests and generate report
        run: python -m pytest -v --junitxml=test-results.xml


      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report
          path: test-results.xml




      - name: Use a GitHub Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available!"
          else
            echo "Secret is missing!"
            exit 1
          fi


  build:
    name: Build stage
    needs: test
    runs-on: ubuntu-latest

    env:
      BUILD_STAGE: validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display build message
        run: echo "Tests passed! The build stage can start."

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Display build information
        run: |
          echo "Application: $APP_NAME"
          echo "Build stage: $BUILD_STAGE"
