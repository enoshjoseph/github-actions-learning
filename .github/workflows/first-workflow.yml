
name: My First GitHub Action

on:
  push:
    paths:
      - 'hello.py'
      - 'test_math.py'
      - '.github/workflows/first-workflow.yml'

  pull_request:
    paths:
      - 'hello.py'
      - 'test_math.py'
      - '.github/workflows/first-workflow.yml'

  workflow_dispatch:

env:
  APP_NAME: GitHubActionsLearning

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Use a GitHub Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available!"
          else
            echo "Secret is missing!"
            exit 1
          fi

      - name: Run automated tests and generate report
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-report-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  build:
    name: Build stage
    needs: test
    runs-on: ubuntu-latest

    env:
      BUILD_STAGE: validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run my custom welcome action
        uses: ./.github/actions/welcome
        with:
          app-name: ${{ env.APP_NAME }}

      - name: Display build message
        if: success()
        run: echo "Tests passed! The build stage can start."

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Display build information
        run: |
          echo "Application: $APP_NAME"
          echo "Build stage: $BUILD_STAGE"
  reusable-tests:
    uses: ./.github/workflows/reusable-tests.yml